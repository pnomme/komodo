name: CI

on:
  push:
    branches: [main, anycloud]
  pull_request:
    branches: [main, anycloud]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  KOMODO_VERSION: "2.3.4"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/komodo-core

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

  fmt:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  docker:
    name: Build & Publish Docker
    runs-on: ubuntu-latest
    needs: [build, fmt]

    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/anycloud'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=anycloud
            type=raw,value=${{ env.KOMODO_VERSION }}-anycloud
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./bin/core/aio.Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            VERSION=${{ env.KOMODO_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
